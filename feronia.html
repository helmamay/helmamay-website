<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Feronia, original abstract floral artwork by Helmamay Studios, shown in a collection of interior settings.">
  <title>Feronia | Helmamay Studios</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #faf8f3;
      color: #292724;
      font-family: Georgia, serif;
      text-align: center;
    }

    header {
      padding: 60px 20px 35px;
    }

    h1 {
      font-size: 48px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #77716a;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #292724;
      text-decoration: none;
      border-bottom: 1px solid #292724;
      padding-bottom: 4px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 24px 80px;
    }

    .original {
      display: block;
      max-width: 280px;
      max-height: 850px;
      width: auto;
      height: auto;
      margin: 0 auto 65px;
      object-fit: contain;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 35px;
    }

    figure {
      margin: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      h1 { font-size: 36px; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Feronia</h1>
    <p class="subtitle">Original Artwork | Helmamay Studios</p>
    <a class="back" href="index.html">← Back to Gallery</a>
  </header>

  <main>
    <img class="original" src="Feronia.jpg" alt="Feronia original artwork">

    <div class="gallery">
      <figure>
        <img src="Feronia2.png" alt="Feronia interior mockup 2">
      </figure>

      <figure>
        <img src="Feronia4.png" alt="Feronia interior mockup 4">
      </figure>

      <figure>
        <img src="Feronia3.png" alt="Feronia interior mockup 3">
      </figure>

      <figure>
        <img src="Feronia5.png" alt="Feronia interior mockup 5">
      </figure>

      <figure>
        <img src="Feronia6.png" alt="Feronia interior mockup 6">
      </figure>

      <figure>
        <img src="Feronia1.png" alt="Feronia interior mockup 1">
      </figure>
    </div>
  </main>
</body>
</html>
