<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Discover Gaia, original abstract artwork by Helmamay Studios for residential and commercial interiors. Custom fine-art prints for interior designers and decorators.">

<link rel="canonical" href="https://www.helmamay.com/gaia.html">


<title>Gaia | Original Abstract Art for Interiors | Helmamay Studios</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#292724;font-family:Georgia,serif;text-align:center}header{padding:60px 20px 35px}h1{font-size:48px;font-weight:normal;margin:0 0 12px}.subtitle{color:#77716a;font-size:16px;letter-spacing:1px}.back{display:inline-block;margin-top:20px;color:#292724;text-decoration:none;border-bottom:1px solid #292724;padding-bottom:4px}main{max-width:1100px;margin:auto;padding:20px 24px 80px}.original{display:block;max-width:280px;max-height:850px;width:auto;height:auto;margin:0 auto 65px;object-fit:contain}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:35px}figure{margin:0}figure img{display:block;width:100%;height:auto}.customize{margin:85px auto 0;max-width:820px;border-top:1px solid #ded9d0;padding-top:45px}.customize h2{font-weight:normal;font-size:30px}.intro{line-height:1.6;color:#67625d}.preview-area{margin:32px auto 38px;display:flex;justify-content:center}.frame{background:#9c744d;padding:13px;box-shadow:0 5px 18px #0002;max-width:100%}.mat{background:#fffef8;padding:28px;max-width:100%}.mat img{display:block;max-width:100%;width:240px;height:auto;max-height:430px;object-fit:contain}.quote-form{text-align:left;max-width:610px;margin:0 auto}.quote-form label{display:block;margin:18px 0 6px;font-size:15px}.quote-form input,.quote-form select,.quote-form textarea{display:block;width:100%;padding:12px;border:1px solid #bdb7ad;border-radius:0;background:#fffefa;color:#292724;font:16px Georgia,serif}.quote-form button{margin-top:25px;padding:14px 25px;background:#292724;color:white;border:0;font:16px Georgia,serif;cursor:pointer}.quote-form button:disabled{opacity:.6;cursor:wait}.form-status{margin-top:16px;min-height:1.5em}.hint{font-size:13px;color:#77716a;margin-top:9px}@media(max-width:700px){h1{font-size:36px}.gallery{grid-template-columns:1fr}.mat img{width:200px}.customize{margin-top:60px}}
</style>
</head>
<body>
<header><h1>Gaia</h1><p class="subtitle">Original Artwork | Helmamay Studios</p><a class="back" href="index.html">← Back to Gallery</a></header>
<main>
<img class="original" src="terra.jpg" alt="Gaia original artwork">
<div class="gallery">
<figure><img src="terra2.png" alt="Gaia interior mockup 1"></figure>
<figure><img src="terra4.png" alt="Gaia interior mockup 3"></figure>
<figure><img src="terra6.png" alt="Gaia interior mockup 5"></figure>
<figure><img src="terra5.png" alt="Gaia interior mockup 4"></figure>
<figure><img src="terra3.png" alt="Gaia interior mockup 2"></figure>
</div>
<section class="customize" aria-labelledby="customize-heading">
<h2 id="customize-heading">Customize This Artwork</h2>
<p class="intro">Explore frame and mat combinations, then request a personalized trade quote for your project.</p>
<div class="preview-area"><div class="frame" id="framePreview"><div class="mat" id="matPreview"><img src="terra.jpg" alt="Gaia with selected frame and mat"></div></div></div>
<form id="quoteForm" class="quote-form" action="https://formspree.io/f/xeaewlqp" method="POST">
<input type="hidden" name="Artwork" value="Gaia"><input type="hidden" name="_subject" value="Helmamay Studios trade quote request — Gaia">
<label for="printSize">Print size</label><select id="printSize" name="Print size" required><option value="8 × 10 inches">8 × 10 inches</option><option value="16 × 20 inches">16 × 20 inches</option><option value="24 × 30 inches">24 × 30 inches</option><option value="Custom size">Custom size — describe below</option></select>
<label for="frameFinish">Frame finish</label><select id="frameFinish" name="Frame finish" required><option value="Natural Wood">Natural Wood</option><option value="Black">Black</option><option value="White">White</option></select>
<label for="matting">Matting</label><select id="matting" name="Matting" required><option value="White">White</option><option value="Ivory">Ivory</option><option value="No Mat">No Mat</option></select>
<label for="quantity">Quantity</label><input id="quantity" name="Quantity" type="number" min="1" step="1" value="1" required>
<label for="clientName">Your name</label><input id="clientName" name="Name" autocomplete="name" required>
<label for="company">Company / design studio</label><input id="company" name="Company" autocomplete="organization" required>
<label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required>
<label for="phone">Phone (optional)</label><input id="phone" name="Phone" type="tel" autocomplete="tel">
<label for="location">Project location (optional)</label><input id="location" name="Project location">
<label for="notes">Project details, custom sizing, or questions (optional)</label><textarea id="notes" name="Project notes" rows="4"></textarea>
<p class="hint">For interior design trade inquiries. Local pickup or delivery arrangements can be discussed in your quote.</p>
<button type="submit">Request a Trade Quote</button><p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script>
(function(){
const form=document.getElementById('quoteForm');const status=document.getElementById('formStatus');const button=form.querySelector('button[type="submit"]');
form.addEventListener('submit',async function(event){event.preventDefault();button.disabled=true;status.textContent='Sending your request…';try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(response.ok){status.textContent='Thank you. Your quote request has been sent.';form.reset();window.HelmamayCustomizer.updatePreview();}else{status.textContent='Your request could not be sent. Please try again.';}}catch(error){status.textContent='Connection problem. Please try again.';}finally{button.disabled=false;}});
})();
</script>
<script src="customizer.js" defer></script>
</body>
</html>
