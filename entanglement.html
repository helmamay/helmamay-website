<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terra, original abstract artwork by Helmamay Studios, shown in a collection of interior settings.">
  <title>Terra | Helmamay Studios</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf8f3;
      color: #292724;
      font-family: Georgia, serif;
      text-align: center;
    }
    header { padding: 45px 20px 25px; }
    h1 { font-size: 36px; font-weight: normal; margin-bottom: 10px; }
    .subtitle { color: #777; font-size: 15px; }
    .back {
      display: inline-block;
      margin-top: 24px;
      color: #292724;
      text-decoration: underline;
    }
    main {
      max-width: 1100px;
      margin: 20px auto 70px;
      padding: 0 22px;
    }
    .original {
      max-width: 360px;
      width: 100%;
      height: auto;
      margin: 20px auto 55px;
      display: block;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    figure { margin: 0; }
    @media (max-width: 650px) {
      .gallery { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Terra</h1>
    <p class="subtitle">Original Artwork | Helmamay Studios</p>
    <a class="back" href="index.html">← Back to Gallery</a>
  </header>

  <main>
    <img class="original" src="a15 green purple.jpg" alt="Terra original artwork">

    <div class="gallery">
      <figure>
        <img src="Smartist_71452741-8415-4587-A4A5-D611D5EDDB4A.png" alt="Terra displayed in an interior setting">
      </figure>
      <figure>
        <img src="Smartist_539916A7-8AB4-4839-A2C7-0DEEFE7312BA.png" alt="Terra displayed in an interior setting">
      </figure>
      <figure>
        <img src="Smartist_38BCEBFA-F93B-428D-98E8-3C06E10FA085.png" alt="Terra displayed in an interior setting">
      </figure>
      <figure>
        <img src="Smartist_364D99C4-43AC-48DE-B205-1BD932E59DF6.png" alt="Terra displayed in an interior setting">
      </figure>
    </div>
  </main>
</body>
</html>
