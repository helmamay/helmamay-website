
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pomona, original abstract artwork by Helmamay Studios, shown in a collection of interior settings.">
  <title>Pomona | Helmamay Studios</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf8f3;
      color: #292724;
      font-family: Georgia, serif;
      text-align: center;
    }
    header { padding: 45px 20px 25px; }
    h1 { font-size: 36px; font-weight: normal; margin-bottom: 10px; }
    .subtitle { color: #777; font-size: 15px; }
    .back {
      display: inline-block;
      margin-top: 24px;
      color: #292724;
      text-decoration: underline;
    }
    main {
      max-width: 1100px;
      margin: 20px auto 70px;
      padding: 0 22px;
    }
    .original {
      max-width: 480px;
      width: 100%;
      height: auto;
      margin: 20px auto 55px;
      display: block;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    figure { margin: 0; }
    figcaption {
      font-size: 14px;
      color: #666;
      padding: 12px 0 18px;
    }
    @media (max-width: 650px) {
      .gallery { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pomona</h1>
    <p class="subtitle">Original Artwork | Helmamay Studios</p>
    <a class="back" href="index.html">← Back to Gallery</a>
  </header>

  <main>
    <img class="original" src="lemon lime.jpg" alt="Pomona original artwork">

    <div class="gallery">
      <figure>
        <img src="Smartist_328A008F-B332-4626-8A8F-5F385EC9AC2D.png" alt="Pomona in a blue kitchen">
        <figcaption>Blue Kitchen</figcaption>
      </figure>
      <figure>
        <img src="Smartist_F3C27F22-CECF-4BEA-85C2-ADCA7568511D.png" alt="Pomona above a yellow table">
        <figcaption>Dining Area</figcaption>
      </figure>
      <figure>
        <img src="Smartist_245E78B1-2BB3-4AF7-BBC2-A2D3606F38CF.png" alt="Pomona above a wooden bench">
        <figcaption>Natural Interior</figcaption>
      </figure>
      <figure>
        <img src="Smartist_A8EF166D-039F-4764-A92A-FECF5B78086A.png" alt="Pomona against a green wall">
        <figcaption>Green Interior</figcaption>
      </figure>
      <figure>
        <img src="Smartist_C55C5F8D-2D1C-4615-A5C3-CAB2F0217BFF.png" alt="Pomona in a living room">
        <figcaption>Living Room</figcaption>
      </figure>
      <figure>
        <img src="Smartist_CB15A956-BC65-4DDB-8989-DF05A187D7FE.png" alt="Pomona in a colorful kitchen">
        <figcaption>Colorful Kitchen</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
