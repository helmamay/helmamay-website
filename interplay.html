<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Discover Nerio, original abstract artwork by Helmamay Studios for residential and commercial interiors. Custom fine-art prints for interior designers and decorators.">

<link rel="canonical" href="https://www.helmamay.com/interplay.html">


<title>Nerio | Original Abstract Art for Interiors | Helmamay Studios</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#292724;font-family:Georgia,serif;text-align:center}header{padding:48px 20px 30px}h1{font-size:44px;font-weight:normal;margin:0 0 12px}.subtitle{color:#77716a;letter-spacing:1px}.back{display:inline-block;margin-top:20px;color:inherit;text-decoration:none;border-bottom:1px solid;padding-bottom:4px}main{max-width:1100px;margin:auto;padding:20px 24px 80px}.original{display:block;max-width:360px;max-height:480px;width:auto;height:auto;margin:15px auto 60px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.gallery figure{margin:0}.gallery img{display:block;width:100%;height:auto}.customize{max-width:820px;margin:90px auto 0;border-top:1px solid #d9d2c7;padding-top:42px}.customize h2{font-size:30px;font-weight:normal}.customize p{line-height:1.6;color:#5d5851}.preview-wrap{padding:25px;display:flex;justify-content:center;align-items:center;min-height:360px}.frame{background:#9c744d;padding:13px;box-shadow:0 8px 25px #0003;max-width:100%;transition:background .15s}.mat{background:#fffef8;padding:30px;transition:padding .15s,background .15s}.mat img{display:block;max-width:100%;width:245px;height:auto;max-height:380px;object-fit:contain}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0;text-align:left}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:14px}select,input,textarea{width:100%;padding:12px;border:1px solid #bcb4a9;background:#fffdf9;color:#292724;font:16px Georgia,serif;border-radius:0}textarea{min-height:110px;resize:vertical}.form-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left}.wide{grid-column:1/-1}button{padding:14px 26px;border:0;background:#292724;color:#fff;font:16px Georgia,serif;cursor:pointer;margin-top:22px}button:disabled{opacity:.6;cursor:wait}#status{min-height:1.5em;margin-top:15px}@media(max-width:650px){h1{font-size:34px}.gallery,.choices,.form-fields{grid-template-columns:1fr}.wide{grid-column:auto}.preview-wrap{padding:12px}.mat{padding:20px}.mat img{width:200px}}
</style>
</head>
<body>
<header><h1>Nerio</h1><p class="subtitle">Original Artwork | Helmamay Studios</p><a class="back" href="index.html">← Back to Gallery</a></header>
<main>
<img class="original" src="a13 blue red.jpg" alt="Nerio original artwork">
<div class="gallery">
      <figure><img src="Smartist_B1882146-AA2F-434A-8028-5CFDA26A9A6A.png" alt="Nerio displayed in an interior setting" loading="lazy"></figure>
      <figure><img src="Smartist_7F877C50-DF14-4189-A895-154B41355CB9.png" alt="Nerio displayed in an interior setting" loading="lazy"></figure>
      <figure><img src="Smartist_F52412F5-F110-4AB4-9C4F-7F3B879514EC.png" alt="Nerio displayed in an interior setting" loading="lazy"></figure>
      <figure><img src="Smartist_FCD6E6FC-4ED3-472E-8A78-2AB1789A89E9.png" alt="Nerio displayed in an interior setting" loading="lazy"></figure>
      <figure><img src="Smartist_685EA992-8A71-4CE2-831E-8FAB1226335C.png" alt="Nerio displayed in an interior setting" loading="lazy"></figure>
</div>
<section class="customize" aria-labelledby="custom-title">
<h2 id="custom-title">Customize This Artwork</h2>
<p>Explore frame and matting combinations, then request a custom trade quote for your project. Preview is illustrative; final proportions may vary by print size.</p>
<div class="preview-wrap"><div class="frame" id="frame"><div class="mat" id="mat"><img src="a13 blue red.jpg" alt="Nerio framing and matting preview"></div></div></div>
<form id="quote-form" action="https://formspree.io/f/xeaewlqp" method="POST">
<input type="hidden" name="Artwork" value="Nerio"><input type="hidden" name="_subject" value="Helmamay Studios Trade Quote — Nerio">
<div class="choices">
<div class="field"><label for="frame-finish">Frame finish</label><select id="frame-finish" name="Frame finish"><option>Natural Wood</option><option>Black</option><option>White</option></select></div>
<div class="field"><label for="mat-choice">Matting</label><select id="mat-choice" name="Matting"><option>White</option><option>Ivory</option><option>No Mat</option></select></div>
<div class="field"><label for="print-size">Print size</label><select id="print-size" name="Print size"><option>8 × 10 inches</option><option>16 × 20 inches</option><option>24 × 30 inches</option><option>Custom size — specify below</option></select></div>
<div class="field"><label for="quantity">Quantity</label><input id="quantity" name="Quantity" type="number" min="1" value="1" required></div>
</div>
<div class="form-fields">
<div class="field"><label for="name">Name *</label><input id="name" name="Name" required autocomplete="name"></div>
<div class="field"><label for="company">Company / Design Studio *</label><input id="company" name="Company" required></div>
<div class="field"><label for="email">Email *</label><input id="email" name="Email" type="email" required autocomplete="email"></div>
<div class="field"><label for="phone">Phone (optional)</label><input id="phone" name="Phone" type="tel" autocomplete="tel"></div>
<div class="field wide"><label for="location">Project location (optional)</label><input id="location" name="Project location"></div>
<div class="field wide"><label for="notes">Custom dimensions or project details (optional)</label><textarea id="notes" name="Project details"></textarea></div>
</div>
<button id="submit" type="submit">Request Trade Quote</button><p id="status" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script>
const form=document.getElementById('quote-form'),status=document.getElementById('status'),submit=document.getElementById('submit');
form.addEventListener('submit',async function(e){e.preventDefault();status.textContent='Sending your request…';submit.disabled=true;try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.ok)throw new Error('Submission failed');status.textContent='Thank you. Your trade quote request has been sent.';form.reset();window.HelmamayCustomizer.updatePreview();}catch(err){status.textContent='Your request could not be sent. Please try again.';}finally{submit.disabled=false;}});
</script>
<script src="customizer.js" defer></script>
</body>
</html>
