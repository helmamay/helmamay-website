
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inner Orbit, original abstract artwork by Helmamay Studios, shown in a collection of interior settings.">
  <title>Inner Orbit | Helmamay Studios</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf8f3;
      color: #292724;
      font-family: Georgia, serif;
      text-align: center;
    }
    header { padding: 45px 20px 25px; }
    h1 { font-size: 36px; font-weight: normal; margin-bottom: 10px; }
    .subtitle { color: #777; font-size: 15px; }
    .back {
      display: inline-block;
      margin-top: 24px;
      color: #292724;
      text-decoration: underline;
    }
    main {
      max-width: 1100px;
      margin: 20px auto 70px;
      padding: 0 22px;
    }
    .original {
      max-width: 480px;
      width: 100%;
      height: auto;
      margin: 20px auto 55px;
      display: block;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    figure { margin: 0; }
    @media (max-width: 650px) {
      .gallery { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Inner Orbit</h1>
    <p class="subtitle">Original Artwork | Helmamay Studios</p>
    <a class="back" href="index.html">← Back to Gallery</a>
  </header>

  <main>
    <img class="original" src="a24 red purple.jpg" alt="Inner Orbit original artwork">

    <div class="gallery">
      <figure>
        <img src="redpurp1.png" alt="Inner Orbit displayed in an interior setting">
      </figure>
      <figure>
        <img src="redpurp2.png" alt="Inner Orbit displayed in an interior setting">
      </figure>
      <figure>
        <img src="redpurp5.png" alt="Inner Orbit displayed in an interior setting">
      </figure>
      <figure>
        <img src="redpurp7.png" alt="Inner Orbit displayed in an interior setting">
      </figure>
      <figure>
        <img src="redpurp8.png" alt="Inner Orbit displayed in an interior setting">
      </figure>
    </div>
  </main>
</body>
</html>
